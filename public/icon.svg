<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- A barely-there lift so the field is not a flat black hole on a home
         screen. Below the threshold where it reads as a gradient. -->
    <radialGradient id="lift" cx="0.5" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#F4EFE4" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#F4EFE4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="#0C0414"/>
  <rect width="512" height="512" rx="116" fill="url(#lift)"/>
  <g transform="translate(0.0 0.0) scale(1)">
    <g stroke="#F4EFE4" stroke-width="26" stroke-linecap="round"><line x1="184" y1="165" x2="184" y2="347"/><line x1="232" y1="165" x2="232" y2="347"/><line x1="280" y1="165" x2="280" y2="347"/><line x1="328" y1="165" x2="328" y2="347"/></g>
    <!-- The fifth mark. Its ends stop ON the outer uprights: run it past them
         and the glyph reads as a "prohibited" slash instead of a tally. -->
    <line x1="184" y1="332" x2="328" y2="180" stroke="#8FA083" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
